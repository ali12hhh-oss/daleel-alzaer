name: Complete Native UI Fixes

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply safe native UI fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/daleelalzaer/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          # 1) Every main HomeCard must actually navigate when tapped.
          old_home = '''private fun HomeCard(nav: NavHostController, title: String, subtitle: String, icon: ImageVector, route: String) {
              AnimatedSurface(Modifier.fillMaxWidth().padding(horizontal = 16.dp)) {'''
          new_home = '''private fun HomeCard(nav: NavHostController, title: String, subtitle: String, icon: ImageVector, route: String) {
              AnimatedSurface(Modifier.fillMaxWidth().padding(horizontal = 16.dp), { nav.navigate(route) }) {'''
          if old_home in text and new_home not in text:
              text = text.replace(old_home, new_home, 1)

          # 2) Add the standalone rakah-counter route.
          route_anchor = '                composable("prayer") { PrayerScreen(nav) }\n'
          route_insert = route_anchor + '                composable("rakah") { RakahCounterScreen(nav) }\n'
          if 'composable("rakah")' not in text:
              if route_anchor not in text:
                  raise SystemExit('Prayer route anchor not found')
              text = text.replace(route_anchor, route_insert, 1)

          # 3) Keep the existing main-section naming and add the new independent section.
          home_anchor = '            item { HomeCard(nav, "مواقيت الصلاة", "حسب كتيب مواقيت الصلاة للسيد السيستاني", Icons.Default.AccessTime, "prayer") }\n'
          home_insert = home_anchor + '            item { HomeCard(nav, "عداد الركعات", "عداد مستقل للركعات أثناء الصلاة", Icons.Default.FormatListNumbered, "rakah") }\n'
          if 'HomeCard(nav, "عداد الركعات"' not in text:
              if home_anchor not in text:
                  raise SystemExit('Prayer home-card anchor not found')
              text = text.replace(home_anchor, home_insert, 1)

          # 4) Standalone screen using the current native UI architecture.
          anchor = '@Composable private fun QadaScreen(nav: NavHostController) {'
          screen = r'''@Composable
          private fun RakahCounterScreen(nav: NavHostController) {
              var count by rememberSaveable { mutableIntStateOf(0) }

              Page("عداد الركعات", Icons.Default.FormatListNumbered, nav) { p ->
                  Column(
                      Modifier.fillMaxSize()
                          .padding(p)
                          .verticalScroll(rememberScrollState())
                          .padding(16.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Info(
                          "عداد الركعات",
                          "عداد مستقل للركعات أثناء الصلاة",
                          Icons.Default.FormatListNumbered
                      )

                      Spacer(Modifier.height(24.dp))

                      Card(
                          Modifier.fillMaxWidth(),
                          RoundedCornerShape(28.dp),
                          colors = CardDefaults.cardColors(
                              containerColor = MaterialTheme.colorScheme.surfaceVariant
                          )
                      ) {
                          Column(
                              Modifier.fillMaxWidth().padding(24.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  "عدد الركعات",
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )

                              Spacer(Modifier.height(12.dp))

                              Box(
                                  Modifier.size(190.dp)
                                      .clip(CircleShape)
                                      .background(MaterialTheme.colorScheme.primary.copy(alpha = 0.12f)),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Box(
                                      Modifier.size(158.dp)
                                          .clip(CircleShape)
                                          .background(MaterialTheme.colorScheme.primary),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          count.toString(),
                                          color = MaterialTheme.colorScheme.onPrimary,
                                          fontSize = 58.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }

                              Spacer(Modifier.height(22.dp))

                              ActionButton(
                                  "إضافة ركعة",
                                  { count++ },
                                  Modifier.fillMaxWidth()
                              )

                              Spacer(Modifier.height(10.dp))

                              ActionButton(
                                  "تصفير العداد",
                                  { count = 0 },
                                  Modifier.fillMaxWidth(),
                                  MaterialTheme.colorScheme.secondary
                              )
                          }
                      }
                  }
              }
          }

          '''
          if 'private fun RakahCounterScreen' not in text:
              if anchor not in text:
                  raise SystemExit('Qada screen anchor not found')
              text = text.replace(anchor, screen + anchor, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit changes when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/daleelalzaer/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Add standalone rakah counter and fix home navigation"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
